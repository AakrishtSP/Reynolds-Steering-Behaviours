# This starter workflow is for a CMake project running on multiple platforms. There is a different starter workflow if you just want a single platform.
# See: https://github.com/actions/starter-workflows/blob/main/ci/cmake-single-platform.yml
name: CMake Build and Release 

on:
  push:
    branches: "*"

  pull_request:
    branches: [ "master" ]


jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      # Set fail-fast to false to ensure that feedback is delivered for all matrix combinations. Consider changing this to true when your workflow is stable.
      fail-fast: false

      # Set up a matrix to run the following 3 configurations:
      # 1. <Windows, Release, latest MSVC compiler toolchain on the default runner image, default generator>
      # 2. <Linux, Release, latest GCC compiler toolchain on the default runner image, default generator>
      # 3. <Linux, Release, latest Clang compiler toolchain on the default runner image, default generator>
      #
      # To add more build types (Release, Debug, RelWithDebInfo, etc.) customize the build_type list.
      matrix:
        os: [ubuntu-latest, windows-latest]
        build_type: [Release]
        c_compiler: [gcc, clang, cl]
        include:
          - os: windows-latest
            c_compiler: cl
            cpp_compiler: cl
          - os: ubuntu-latest
            c_compiler: gcc
            cpp_compiler: g++
          - os: ubuntu-latest
            c_compiler: clang
            cpp_compiler: clang++
        exclude:
          - os: windows-latest
            c_compiler: clang
          - os: windows-latest
            c_compiler: gcc
          - os: ubuntu-latest
            c_compiler: cl

    steps:
    - uses: actions/checkout@v4
      # with:
      #   submodules: recursive

    - name: Set up CMake
      uses: jwlawson/actions-setup-cmake@v2
      with:
          cmake-version: '3.30.x'

    - name: Init submodules
      run: git submodule update --init --recursive

    - name: Restore cache
      uses: actions/cache@v4
      with:
        path: |
          build/

        key: ${{ runner.os }}-build-${{ hashFiles('**/CMakeLists.txt') }}

    - name: Install Dependencies on Ubuntu
      if: runner.os == 'Linux'
      run: |
          sudo apt-get update
          sudo apt-get install -y \
            wayland-protocols \
            libwayland-dev \
            libxkbcommon-dev \
            libx11-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            libgl1-mesa-dev


    - name: Configure CMake
      run: |
          cmake -B build -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }} -DCMAKE_C_COMPILER=${{ matrix.c_compiler }} -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -S ${{ github.workspace }}


    - name: Build
      # Build your program with the given configuration. Note that --config is needed because the default Windows generator is a multi-config generator (Visual Studio generator).
      # run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config ${{ matrix.build_type }}
      run: cmake --build build --config ${{ matrix.build_type }}

    - name: Test
      # working-directory: ${{ steps.strings.outputs.build-output-dir }}
      working-directory: build
      # Execute tests defined by the CMake configuration. Note that --build-config is needed because the default Windows generator is a multi-config generator (Visual Studio generator).
      # See https://cmake.org/cmake/help/latest/manual/ctest.1.html for more detail
      run: ctest --build-config ${{ matrix.build_type }}


    - name: Check if this is the main repo and on master branch
      id: release_check
      shell: bash
      run: |
        if [[ "${{ github.repository }}" == "AakrishtSP/Reynolds-Steering-Behaviours" && "${{ github.ref }}" == "refs/heads/master" ]]; then
          echo "release=true" >> $GITHUB_OUTPUT
        else
          echo "release=false" >> $GITHUB_OUTPUT
        fi

    - name: Set Zip Filename
      if: steps.release_check.outputs.release == 'true'
      shell: bash
      run: |
        if [[ "$RUNNER_OS" == "Windows" ]]; then
          echo "ZIP_NAME=Reynold_Steering_Behaviours_windows_latest_${{ matrix.c_compiler }}_amd64.zip" >> "$GITHUB_ENV"
        else
          echo "ZIP_NAME=Reynold_Steering_Behaviours_linux_latest_${{ matrix.c_compiler }}_amd64.zip" >> "$GITHUB_ENV"
        fi
        
    - name: Move executable to bin folder (Windows only)
      if: steps.release_check.outputs.release == 'true' && runner.os == 'Windows'
      shell: bash
      run: |
        # Move the executable from Release to the bin directory on Windows
        mv -f build/build/bin/Release/*.exe build/build/bin/

    - name: Zip the bin folder
      if: steps.release_check.outputs.release == 'true'
      shell: bash
      run: |
        if [[ "$RUNNER_OS" == "Windows" ]]; then
        powershell -Command "Compress-Archive -Force -Path build/build/bin/ -DestinationPath build/$ZIP_NAME"
        else
        cd build
        zip -r "$ZIP_NAME" build/bin/
        fi

        
    - name: Check if GitHub Release already exists
      id: check_release
      if: env.create_release == 'true'
      shell: bash
      run: |
        REPO="AakrishtSP/Reynolds-Steering-Behaviours"
        TAG_NAME="v1.0.${{ github.run_number }}-${{ github.sha }}"
        RELEASE_EXISTS=$(curl -s --header "Authorization: token ${{ secrets.GH_PAT }}" \
          "https://api.github.com/repos/$REPO/releases/tags/$TAG_NAME")
        if [[ "$RELEASE_EXISTS" == *"Not Found"* ]]; then
          echo "Release does not exist. Proceeding with release creation."
          echo "create_release=true" >> $GITHUB_ENV
        else
          echo "Release already exists. Skipping release creation."
          echo "create_release=false" >> $GITHUB_ENV
        fi

    - name: Create GitHub Release (if it doesn't exist)
      if: env.create_release == 'true'
      id: create_release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.${{ github.run_number }}-${{ github.sha }}
        name: "Reynold Steering Behaviours Build ${{ github.run_number }}"
        draft: false
        prerelease: false
        token: ${{ secrets.GH_PAT }}

    - name: Upload Release Asset
      if: env.create_release == 'true'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.${{ github.run_number }}-${{ github.sha }}
        files: build/${{ env.ZIP_NAME }}
        token: ${{ secrets.GH_PAT }}
